[workspace]
members = [
    "src/network",
    "src/config",
    "src/monitoring",
    "src/core",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["HyperMine Core Contributors"]
license = "MIT"
description = "Universal High-Performance Cryptocurrency Miner"

[workspace.dependencies]
tokio = { version = "1.42", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
ring = "0.17"
rustls = "0.23"
axum = "0.8"
prometheus = "0.14"
notify = "7.0"
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.9"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
