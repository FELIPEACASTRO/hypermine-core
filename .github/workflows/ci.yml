name: HyperMine Core CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Lint and Format Check
  # ============================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ============================================================================
  # Build and Test (Linux x86-64)
  # ============================================================================
  build-linux:
    name: Build Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm libssl-dev
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build (Release)
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_CUDA=OFF \
            -DENABLE_OPENCL=OFF \
            -DENABLE_TESTS=ON \
            -DENABLE_BENCH=ON
          ninja -j$(nproc)
      
      - name: Run Tests
        run: cd build && ctest --output-on-failure
      
      - name: Run Rust Tests
        run: cargo test --all --release
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypermine-linux-x86_64
          path: build/hypermine

  # ============================================================================
  # Build Docker Image
  # ============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, build-linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        run: |
          docker build -t hypermine-core:latest .
      
      - name: Test Docker image
        run: |
          docker run --rm hypermine-core:latest --version

  # ============================================================================
  # Release Binaries
  # ============================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-linux]
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hypermine-linux-x86_64
      
      - name: Create tarball
        run: |
          chmod +x hypermine
          tar czf hypermine-linux-x86_64.tar.gz hypermine
      
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: hypermine-linux-x86_64.tar.gz
